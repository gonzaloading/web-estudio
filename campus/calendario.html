<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Añadir al calendario · Mi campus</title>
  <meta name="theme-color" content="#0d3a2b">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <!-- Página de paso: la app instalada en el iPhone la abre en Safari para poder añadir el .ics a Calendario.
       El evento viaja en la parte del enlace tras el # (no se envía a ningún servidor). -->
  <script>try{var v=JSON.parse(localStorage.getItem('gonzaloading-vista')||'{}'),t=v.tema||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'oscuro':'claro';document.documentElement.dataset.tema=t}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .cal-paso { max-width: 520px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px 40px }
    .cal-paso h1 { font-size: 26px; color: var(--tit); margin: 0 0 6px }
    .cal-paso ul { margin: 14px 0 18px; padding-left: 20px; line-height: 1.5 }
    .cal-paso .btn { width: 100%; justify-content: center; font-size: 17px; padding: 14px }
    .cal-paso p { line-height: 1.5 }
  </style>
</head>
<body>
  <main class="cal-paso">
    <section class="card pad">
      <h1>Añadir al calendario</h1>
      <p class="tenue" id="intro">Pulsa el botón y elige «Añadir» en la ventana que aparece.</p>
      <ul id="lista"></ul>
      <button class="btn lima" id="anadir" type="button">Añadir a Calendario</button>
      <p class="tenue peq">Si no aparece nada, abre esta página en Safari (botón Compartir → «Abrir en Safari») y vuelve a pulsar el botón. También puedes usar la opción de Google Calendar desde Mi campus.</p>
      <p><a class="link" href="./#/examenes">Volver a Mi campus</a></p>
    </section>
  </main>
  <script>
    var ics = '';
    try { ics = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    var lista = document.getElementById('lista'), boton = document.getElementById('anadir');
    // Títulos de los eventos (línea SUMMARY, que puede venir partida en varias líneas)
    var titulos = (ics.replace(/\r\n /g, '').match(/^SUMMARY:.*$/gm) || []).map(function (l) { return l.slice(8).replace(/\\([,;\\])/g, '$1').replace(/\\n/g, ' '); });
    if (!titulos.length) {
      document.getElementById('intro').textContent = 'No hay ningún evento que añadir. Vuelve a Mi campus y pulsa de nuevo «Añadir al calendario».';
      boton.hidden = true;
    } else {
      titulos.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; lista.appendChild(li); });
      if (titulos.length > 1) boton.textContent = 'Añadir los ' + titulos.length + ' a Calendario';
    }
    boton.onclick = function () {
      var a = document.createElement('a');
      a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
      a.download = 'mi-campus.ics';
      document.body.appendChild(a); a.click(); a.remove();
    };
  </script>
</body>
</html>
