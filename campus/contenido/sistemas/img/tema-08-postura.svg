<line x1="408" y1="198" x2="446" y2="198" stroke="#13241c" stroke-width="5"/>
<polyline points="150,128 150,222 262,222 262,330 292,330" stroke="#0d3a2b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<polyline points="152,134 156,194 252,194" stroke="#0d3a2b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="158" cy="98" r="19" fill="#0d3a2b"/>
<line x1="172" y1="94" x2="418" y2="94" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5"/>
<path d="M170,194 L170,180 L156,180" fill="none" stroke="#cf3e3e" stroke-width="2"/>
<path d="M248,222 L248,236 L262,236" fill="none" stroke="#cf3e3e" stroke-width="2"/>
<text x="196" y="74" style="font-size:12.5px;font-weight:650;fill:#2563eb;text-anchor:start">ojos a la altura de la parte de arriba de la pantalla</text>
<text x="174" y="183" style="font-size:13px;font-weight:700;fill:#cf3e3e;text-anchor:start">90° en codos</text>
<text x="276" y="252" style="font-size:13px;font-weight:700;fill:#cf3e3e;text-anchor:start">90° en rodillas</text>
<text x="300" y="334" style="font-size:12.5px;font-weight:600;fill:#56645b;text-anchor:start">pies apoyados</text>
