<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285" role="img" aria-label="Animación de una máquina de Turing: el cabezal recorre la cinta 10110, invierte cada bit y queda 01001; al leer un blanco pasa al estado final q1">
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#13241c}
.tit{font-size:20px;font-weight:700;fill:#0d3a2b} .sub{font-size:14px;fill:#56645b}
.lbl{font-size:14px;font-weight:600;text-anchor:middle} .peq{font-size:12px;fill:#56645b;text-anchor:middle}
.fl{stroke:#56645b;stroke-width:2;fill:none}
@keyframes a1{0%,6.92%{opacity:1}9.23%,100%{opacity:0}}.a1{opacity:0;animation:a1 13.0s infinite}
