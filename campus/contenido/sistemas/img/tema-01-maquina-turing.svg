<text x="295.0" y="126" class="a6" style="font-size:24px;font-weight:700;text-anchor:middle;fill:#1f7a4c">0</text>
<rect x="330" y="92" width="70" height="50" fill="#fff" stroke="#0d3a2b" stroke-width="1.5"/>
<text x="365.0" y="126" class="a7" style="font-size:24px;font-weight:700;text-anchor:middle;fill:#56645b">1</text>
<text x="365.0" y="126" class="a8" style="font-size:24px;font-weight:700;text-anchor:middle;fill:#1f7a4c">0</text>
<rect x="400" y="92" width="70" height="50" fill="#fff" stroke="#0d3a2b" stroke-width="1.5"/>
<text x="435.0" y="126" class="a9" style="font-size:24px;font-weight:700;text-anchor:middle;fill:#56645b">0</text>
<text x="435.0" y="126" class="a10" style="font-size:24px;font-weight:700;text-anchor:middle;fill:#1f7a4c">1</text>
<rect x="470" y="92" width="70" height="50" fill="#fff" stroke="#0d3a2b" stroke-width="1.5"/>
<text x="505.0" y="126" style="font-size:22px;font-weight:600;text-anchor:middle;fill:#8a948d">B</text>
<rect x="540" y="92" width="34" height="50" fill="url(#cinta)"/>
<g class="a11"><polygon points="155.0,148 141.0,168 169.0,168" fill="#cf3e3e"/><rect x="121.0" y="168" width="68" height="34" rx="8" fill="#cf3e3e"/><text x="155.0" y="190" class="a12" style="font-size:15px;font-weight:700;fill:#fff;text-anchor:middle">q0</text><text x="155.0" y="190" class="a13" style="font-size:15px;font-weight:700;fill:#fff;text-anchor:middle">q1 · FIN</text><text x="155.0" y="220" style="font-size:12px;fill:#cf3e3e;text-anchor:middle">cabezal</text></g>
<text x="20" y="268" class="sub"><tspan style="font-weight:700;fill:#0d3a2b">Reglas:</tspan>  lee 0 → escribe 1 · lee 1 → escribe 0 · lee B → pasa al estado q1 y para</text>
</svg>
