@keyframes a7{0%,41.54%{opacity:1}43.85%,100%{opacity:0}}.a7{opacity:0;animation:a7 13.0s infinite}
@keyframes a8{0%,41.92%{opacity:0}44.23%,93.0%{opacity:1}97.0%,100%{opacity:0}}.a8{animation:a8 13.0s infinite}
@keyframes a9{0%,53.08%{opacity:1}55.38%,100%{opacity:0}}.a9{opacity:0;animation:a9 13.0s infinite}
@keyframes a10{0%,53.46%{opacity:0}55.77%,93.0%{opacity:1}97.0%,100%{opacity:0}}.a10{animation:a10 13.0s infinite}
@keyframes a11{0.0%{transform:translate(0px,0px)}12.31%{transform:translate(0px,0px)}16.15%{transform:translate(70px,0px)}23.85%{transform:translate(70px,0px)}27.69%{transform:translate(140px,0px)}35.38%{transform:translate(140px,0px)}39.23%{transform:translate(210px,0px)}46.92%{transform:translate(210px,0px)}50.77%{transform:translate(280px,0px)}58.46%{transform:translate(280px,0px)}62.31%{transform:translate(350px,0px)}100%{transform:translate(350px,0px)}}.a11{transform:translate(350px,0px);animation:a11 13.0s infinite}
@keyframes a12{0%,60.0%{opacity:1}62.31%,100%{opacity:0}}.a12{opacity:0;animation:a12 13.0s infinite}
@keyframes a13{0%,60.38%{opacity:0}62.69%,93.0%{opacity:1}97.0%,100%{opacity:0}}.a13{animation:a13 13.0s infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56645b"/></marker>
<marker id="pr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf3e3e"/></marker></defs>
<rect width="640" height="285" fill="#fff"/>
<defs><linearGradient id="cinta"><stop offset="0" stop-color="#e7e3d6"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<text x="20" y="34" class="tit">Máquina de Turing que invierte los bits</text>
<text x="20" y="56" class="sub">Lee la celda, escribe el contrario y avanza a la derecha. Al llegar a un blanco (B), para.</text>
<text x="106" y="124" style="font-size:13px;fill:#56645b;text-anchor:end">cinta</text>
