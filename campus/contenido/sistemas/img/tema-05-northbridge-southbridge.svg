<line x1="498" y1="110" x2="516" y2="110" class="fl" marker-start="url(#pf)" marker-end="url(#pf)"/>
<line x1="684" y1="110" x2="702" y2="110" class="fl" marker-start="url(#pf)" marker-end="url(#pf)"/>
<line x1="600" y1="162" x2="600" y2="222" class="fl" marker-start="url(#pf)" marker-end="url(#pf)"/>
<text x="612" y="197" style="font-size:13px;font-weight:700;fill:#cf3e3e;text-anchor:start">DMI</text>
<g><rect x="530" y="226" width="140" height="44" rx="10" fill="#eef5d6" stroke="#b3cf4c" stroke-width="1.5"/><text x="600.0" y="252.9" style="font-size:14px;font-weight:650;text-anchor:middle;fill:#13241c">Chipset</text></g>
<g><rect x="470" y="300" width="260" height="40" rx="10" fill="#f3f5ef" stroke="#cfd6d1" stroke-width="1.5"/><text x="600.0" y="324.4" style="font-size:12.5px;font-weight:400;text-anchor:middle;fill:#13241c">USB, discos, sonido, red…</text></g>
<line x1="600" y1="274" x2="600" y2="296" class="fl" marker-start="url(#pf)" marker-end="url(#pf)"/>
