<line x1="464" y1="66" x2="464" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="472" y1="66" x2="472" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="480" y1="66" x2="480" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="488" y1="66" x2="488" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="496" y1="66" x2="496" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="504" y1="66" x2="504" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="512" y1="66" x2="512" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="520" y1="66" x2="520" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="528" y1="66" x2="528" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="536" y1="66" x2="536" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="544" y1="66" x2="544" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="552" y1="66" x2="552" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="560" y1="66" x2="560" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="568" y1="66" x2="568" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="576" y1="66" x2="576" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="584" y1="66" x2="584" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="592" y1="66" x2="592" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="600" y1="66" x2="600" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<line x1="608" y1="66" x2="608" y2="144" stroke="#b9c2bb" stroke-width="2"/>
<circle cx="514" cy="105" r="34" fill="#fff" stroke="#56645b" stroke-width="1.5"/>
<g class="aspas"><ellipse cx="514" cy="88" rx="7" ry="15" fill="#8a948d" transform="rotate(0 514 105)"/><ellipse cx="514" cy="88" rx="7" ry="15" fill="#8a948d" transform="rotate(90 514 105)"/><ellipse cx="514" cy="88" rx="7" ry="15" fill="#8a948d" transform="rotate(180 514 105)"/><ellipse cx="514" cy="88" rx="7" ry="15" fill="#8a948d" transform="rotate(270 514 105)"/></g>
<circle cx="514" cy="105" r="6" fill="#56645b"/>
<text x="514" y="52" style="font-size:13px;font-weight:650;fill:#13241c;text-anchor:middle">Radiador + ventilador</text>
<g><rect x="470" y="214" width="100" height="44" rx="10" fill="#fdf3e1" stroke="#c9861a" stroke-width="1.5"/><text x="520.0" y="240.9" style="font-size:14px;font-weight:650;text-anchor:middle;fill:#13241c">Bomba</text></g>
<path d="M622,78 q8,-6 16,0 q8,6 16,0" fill="none" stroke="#cf3e3e" stroke-width="2" marker-end="url(#pr)"/>
<path d="M622,105 q8,-6 16,0 q8,6 16,0" fill="none" stroke="#cf3e3e" stroke-width="2" marker-end="url(#pr)"/>
<path d="M622,132 q8,-6 16,0 q8,6 16,0" fill="none" stroke="#cf3e3e" stroke-width="2" marker-end="url(#pr)"/>
<text x="660" y="108" style="font-size:12px;font-weight:650;fill:#cf3e3e;text-anchor:start">calor</text>
<text x="150" y="84" style="font-size:13px;font-weight:650;fill:#cf3e3e;text-anchor:start">líquido caliente</text>
<text x="250" y="228" style="font-size:13px;font-weight:650;fill:#2563eb;text-anchor:start">líquido frío</text>
<text x="20" y="312" style="font-size:12px;font-weight:400;fill:#56645b;text-anchor:start">① El bloque absorbe el calor del procesador (conducción)  ② el líquido caliente va al radiador</text>
<text x="20" y="330" style="font-size:12px;font-weight:400;fill:#56645b;text-anchor:start">③ el ventilador lo enfría y expulsa el calor  ④ la bomba devuelve el líquido frío al bloque. Y vuelta a empezar.</text>
</svg>
