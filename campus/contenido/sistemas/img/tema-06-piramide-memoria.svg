<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" width="680" height="305" role="img" aria-label="Pirámide de la jerarquía de memoria: arriba la caché, en medio la memoria principal y abajo el almacenamiento secundario. Hacia arriba es más rápida y cara; hacia abajo, más capacidad y más barata">
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#13241c}
.tit{font-size:20px;font-weight:700;fill:#0d3a2b} .sub{font-size:14px;fill:#56645b}
.lbl{font-size:14px;font-weight:600;text-anchor:middle} .peq{font-size:12px;fill:#56645b;text-anchor:middle}
.fl{stroke:#56645b;stroke-width:2;fill:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56645b"/></marker>
<marker id="pr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf3e3e"/></marker></defs>
<rect width="680" height="305" fill="#fff"/>
<text x="20" y="30" style="font-size:18px;font-weight:700;fill:#0d3a2b;text-anchor:start">La jerarquía de memoria</text>
<polygon points="320.0,50 320.0,50 407.5,120 232.5,120" fill="#cbe56b" stroke="#fff" stroke-width="3"/>
<text x="320" y="100.0" style="font-size:15px;font-weight:700;fill:#13241c;text-anchor:middle">Caché</text>
<polygon points="232.5,120 407.5,120 507.5,200 132.5,200" fill="#fdf3e1" stroke="#fff" stroke-width="3"/>
<text x="320" y="160.0" style="font-size:15px;font-weight:700;fill:#13241c;text-anchor:middle">Memoria principal</text>
<text x="320" y="178.0" style="font-size:13px;font-weight:600;fill:#13241c;text-anchor:middle">(RAM)</text>
<polygon points="132.5,200 507.5,200 620.0,290 20.0,290" fill="#e9f6f5" stroke="#fff" stroke-width="3"/>
<text x="320" y="245.0" style="font-size:15px;font-weight:700;fill:#13241c;text-anchor:middle">Almacenamiento</text>
<text x="320" y="263.0" style="font-size:13px;font-weight:600;fill:#13241c;text-anchor:middle">secundario</text>
<line x1="90" y1="270" x2="90" y2="70" stroke="#cf3e3e" stroke-width="3" marker-end="url(#pr)"/>
<text x="76" y="150" style="font-size:13px;font-weight:650;fill:#cf3e3e;text-anchor:end">más rápida</text>
<text x="76" y="168" style="font-size:13px;font-weight:650;fill:#cf3e3e;text-anchor:end">más cara</text>
<line x1="550" y1="70" x2="550" y2="270" stroke="#1f7a4c" stroke-width="3" marker-end="url(#pf)"/>
<text x="564" y="150" style="font-size:13px;font-weight:650;fill:#1f7a4c;text-anchor:start">más capacidad</text>
<text x="564" y="168" style="font-size:13px;font-weight:650;fill:#1f7a4c;text-anchor:start">más barata</text>
<text x="564" y="252" style="font-size:12px;font-weight:700;fill:#0f8b8d;text-anchor:start">permanente</text>
<text x="564" y="112" style="font-size:12px;font-weight:700;fill:#c9861a;text-anchor:start">volátil</text>
</svg>
